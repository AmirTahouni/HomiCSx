name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create test environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.yml
          cache-environment: true
          post-cleanup: all

      - name: Install HomiCSx
        shell: bash -el {0}
        run: python -m pip install --no-deps -e .

      - name: Run test suite
        shell: bash -el {0}
        run: |
          python -m pytest --cov=homicsx --cov-report=term-missing --cov-fail-under=60
          python -m coverage json -o coverage.json
          python -c "import json; d=json.load(open('coverage.json'))['files']; limits={'homicsx/core/material.py':80,'homicsx/homogenization/linear.py':45,'homicsx/homogenization/driver.py':80,'homicsx/homogenization/nlhelpers.py':45,'homicsx/fem/nonlinear_problem.py':60}; bad={p:(d[p]['summary']['percent_covered'],v) for p,v in limits.items() if d[p]['summary']['percent_covered'] < v}; assert not bad, bad"

      - name: Static analysis
        shell: bash -el {0}
        run: python -m ruff check --select F401,F841 homicsx tests examples validation

      - name: Build documentation with warnings as errors
        shell: bash -el {0}
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

      - name: Build and validate distribution artifacts
        shell: bash -el {0}
        run: |
          python -m build --outdir package-dist
          python -m twine check package-dist/*
          python -m pip install --force-reinstall --no-deps package-dist/*.whl
          cd /tmp
          python -c "import homicsx; assert homicsx.__version__"
