name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create test environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.yml
          cache-environment: true
          post-cleanup: all

      - name: Install HomiCSx
        shell: bash -el {0}
        run: python -m pip install --no-deps -e .

      - name: Run test suite
        shell: bash -el {0}
        run: python -m pytest --cov=homicsx --cov-report=term-missing

      - name: Build documentation with warnings as errors
        shell: bash -el {0}
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
