[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homicsx"
version = "1.0.0"
description = "End-to-end finite-element computational homogenization with FEniCSx"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [
  {name = "Amir Reza Tahouni", email = "tahouniamirreza@gmail.com"},
]
keywords = [
  "computational homogenization",
  "finite element method",
  "FEniCSx",
  "representative volume element",
  "composite materials",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Documentation = "https://homicsx.readthedocs.io/en/latest/"
Issues = "https://github.com/AmirTahouni/HomiCSx/issues"
Repository = "https://github.com/AmirTahouni/HomiCSx"
"Runtime environment" = "https://github.com/AmirTahouni/HomiCSx/blob/v1.0.0/environment.yml"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
docs = [
  "myst-parser>=4,<5",
  "sphinx>=8,<9",
  "sphinx-rtd-theme>=3,<4",
  "sphinxcontrib-katex>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["homicsx*"]
